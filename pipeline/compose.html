<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>whale bake compositor</title></head>
<body>
<script>
/* Holds the captured frames and builds the grid.
   A separate, never-navigated page: bake2.mjs loads one fresh harness page per state
   (so no animation state leaks between rows), and a fresh page would take the frames
   it had already decoded down with it. Here they survive to the end of the run. */
window.__c = {
  shots: [],
  /* decode one captured PNG, remember the pixels, and report the ink bbox in image px */
  async take(b64) {
    const im = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = 'data:image/png;base64,' + b64; });
    const cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.drawImage(im, 0, 0);
    const d = cx.getImageData(0, 0, cv.width, cv.height).data;
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    for (let y = 0; y < cv.height; y++) {
      const row = y * cv.width * 4;
      for (let x = 0; x < cv.width; x++) {
        if (d[row + x * 4 + 3] > 8) {
          if (x < x0) x0 = x; if (x > x1) x1 = x;
          if (y < y0) y0 = y; if (y > y1) y1 = y;
        }
      }
    }
    this.shots.push(im);
    return x0 > x1 ? null : { x0, y0, x1: x1 + 1, y1: y1 + 1 };
  },
  count: () => window.__c.shots.length,
  /* crop the shared box out of every stored shot and lay the rows out as the petdex grid.
     `cap` is where the shots were taken (stage px, 1:1); `box` is the shared framing box. */
  compose(cap, box, cols, fw, fh, rows, real) {
    const cv = document.createElement('canvas');
    cv.width = cols * fw; cv.height = rows * fh;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const im = this.shots[r * real + Math.min(c, real - 1)];
        ctx.drawImage(im, box.x - cap.x, box.y - cap.y, box.w, box.h, c * fw, r * fh, fw, fh);
      }
    }
    return cv.toDataURL('image/png').split(',')[1];
  },
};
</script>
</body></html>
